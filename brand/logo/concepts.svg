<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 176" width="384" height="176" role="img" aria-label="VoiceScribe logo directions">
  <title>VoiceScribe — three logo directions (A recommended)</title>
  <defs>
    <linearGradient id="cTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4CF"/>
      <stop offset="1" stop-color="#0B7884"/>
    </linearGradient>
    <style>
      .lbl{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:700;font-size:13px;fill:#334155}
      .rec{font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-weight:800;font-size:11px;fill:#0B7884}
      .bar{fill:#FFFFFF}
    </style>
  </defs>

  <!-- A: Aperture Wave (RECOMMENDED) — contained waveform in a rounded tile -->
  <g transform="translate(24,16)">
    <rect x="0" y="0" width="80" height="80" rx="24" fill="url(#cTeal)"/>
    <g class="bar">
      <rect x="14" y="28" width="7" height="24" rx="3.5" opacity="0.85"/>
      <rect x="27" y="20" width="7" height="40" rx="3.5" opacity="0.92"/>
      <rect x="40" y="13" width="7" height="54" rx="3.5"/>
      <rect x="53" y="21" width="7" height="38" rx="3.5" opacity="0.92"/>
      <rect x="66" y="27" width="7" height="26" rx="3.5" opacity="0.85"/>
    </g>
  </g>
  <text x="64" y="118" text-anchor="middle" class="lbl">Aperture Wave</text>
  <text x="64" y="136" text-anchor="middle" class="rec">RECOMMENDED</text>

  <!-- B: Soundmark — waveform inside a ring with a privacy aperture gap -->
  <g transform="translate(152,16)">
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#cTeal)" stroke-width="7"/>
    <!-- aperture gap: a notch in the ring -->
    <path d="M 58 13 A 38 38 0 0 1 67 22" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <g fill="#0B7884">
      <rect x="22" y="32" width="6" height="16" rx="3"/>
      <rect x="33" y="24" width="6" height="32" rx="3"/>
      <rect x="44" y="28" width="6" height="24" rx="3"/>
      <rect x="55" y="34" width="6" height="12" rx="3"/>
    </g>
  </g>
  <text x="192" y="118" text-anchor="middle" class="lbl">Soundmark</text>

  <!-- C: On-device — waveform contained by a device boundary -->
  <g transform="translate(280,16)">
    <rect x="18" y="2" width="44" height="76" rx="12" fill="none" stroke="url(#cTeal)" stroke-width="6"/>
    <g fill="#0B7884">
      <rect x="27" y="34" width="5" height="14" rx="2.5"/>
      <rect x="35" y="26" width="5" height="30" rx="2.5"/>
      <rect x="43" y="22" width="5" height="38" rx="2.5"/>
      <rect x="51" y="32" width="5" height="18" rx="2.5"/>
    </g>
  </g>
  <text x="320" y="118" text-anchor="middle" class="lbl">On-device</text>
</svg>
