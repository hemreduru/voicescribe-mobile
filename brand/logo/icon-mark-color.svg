<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="VoiceScribe">
  <title>VoiceScribe — Aperture Wave mark (full colour)</title>
  <!-- A waveform contained within a rounded aperture: voice (the bars) kept
       private and on-device (the enclosure). Self-grounding teal tile reads on
       light or the #080A0F dark base. -->
  <defs>
    <linearGradient id="vsTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4CF"/>
      <stop offset="1" stop-color="#0B7884"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="72" height="72" rx="22" fill="url(#vsTeal)"/>
  <g fill="#FFFFFF">
    <rect x="16" y="36" width="8" height="24" rx="4" opacity="0.85"/>
    <rect x="30" y="26" width="8" height="44" rx="4" opacity="0.92"/>
    <rect x="44" y="18" width="8" height="60" rx="4"/>
    <rect x="58" y="27" width="8" height="42" rx="4" opacity="0.92"/>
    <rect x="72" y="34" width="8" height="28" rx="4" opacity="0.85"/>
  </g>
</svg>
